[project]
name = "cardwise"
version = "0.1.0"
description = "CardWise: credit card deep research. A lead fans out rewards, costs and issuer researchers, then a writer turns their findings into a cited report"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "openai-agents[litellm]>=0.22",
    "google-cloud-aiplatform>=1.40.0",
    "httpx[socks]>=0.27",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
]
